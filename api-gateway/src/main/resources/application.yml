server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  application:
    name: api-gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_ENDPOINT}
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
      #        - id: delivery-service
      #          uri: lb://delivery-service
      #          predicates:
      #            - Path=/deliveries/**, /delivery-service/v3/api-docs, /ws/delivery/**
      discovery:
        locator:
          enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVER_ENDPOINT}

springdoc:
  swagger-ui:
    urls[0]:
      name: delivery-service
      url: /delivery-service/v3/api-docs
    use-root-path: true

logging:
  level:
    com.example.gateway: DEBUG
url:
  origin:
    origin-url: http://localhost:8080
