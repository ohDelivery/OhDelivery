server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  application:
    name: api-gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_ENDPOINT}
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
    gateway:
      discovery:
        locator:
          enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVER_ENDPOINT}

springdoc:
  swagger-ui:
    urls[0]:
      name: delivery-service
      url: /delivery-service/v3/api-docs
    urls[1]:
      name: user-service
      url: /user-service/v3/api-docs
    urls[2]:
      name: consult-service
      url: /consult-service/v3/api-docs
    urls[3]:
      name: delivery-service
      url: /delivery-service/v3/api-docs
    urls[4]:
      name: incentive-service
      
      url: /incentive-service/v3/api-docs
    urls[5]:
      name: match-service
      url: /match-service/v3/api-docs
    urls[6]:
      name: auth-server
      url: /auth-server/v3/api-docs
    use-root-path: true
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: api-gateway

logging:
  level:
    com.example.gateway: DEBUG
url:
  origin:
    origin-url: http://localhost:8080


gateway:
  services:
    - serviceName: user-service
      serviceUri: lb://user-service
      routes:
        - id: user-join
          apiPaths: [/api/users/join]
          filters: []
        - id: user-service
          apiPaths: [/api/users]
          filters:
            - service-default
    - serviceName: auth-server
      serviceUri: lb://auth-server
      routes:
        - id: auth-server
          apiPaths: [/auth/login, /auth/validate]
          filters: []
        - id : auth-logout
          apiPaths: [/auth/logout]
          filters:
            - service-default
