<!DOCTYPE html>
<html>
<head>
  <title>WebSocket Alarm Test</title>
  <style>
    body {
      font-family: sans-serif;
    }

    #messages {
      border: 1px solid #ccc;
      padding: 10px;
      margin-top: 10px;
      height: 300px;
      overflow-y: scroll;
      white-space: pre-wrap;
    }

    .message {
      margin-bottom: 5px;
      padding-bottom: 5px;
      border-bottom: 1px dashed #eee;
    }

    .connect-status {
      font-weight: bold;
    }

    .connected {
      color: green;
    }

    .disconnected {
      color: red;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>

<h1>WebSocket Alarm Test Client</h1>

<!-- 사용자로부터 riderId 입력 받는 필드 -->
<div>
  <label for="riderIdInput">Rider ID:</label>
  <input type="text" id="riderIdInput" placeholder="Enter riderId"/>
</div>

<!-- 연결 / 연결 해제 버튼 -->
<div>
  <button id="connectBtn" onclick="connect()">Connect</button>
  <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
  <span id="status" class="connect-status disconnected">Disconnected</span>
</div>

<h2>Received Alarms:</h2>
<div id="messages"></div>

<script>
  var stompClient = null;
  var messagesDiv = document.getElementById('messages');
  var connectBtn = document.getElementById('connectBtn');
  var disconnectBtn = document.getElementById('disconnectBtn');
  var statusSpan = document.getElementById('status');

  function setConnected(connected) {
    connectBtn.disabled = connected;
    disconnectBtn.disabled = !connected;
    statusSpan.textContent = connected ? 'Connected' : 'Disconnected';
    statusSpan.className = 'connect-status ' + (connected ? 'connected' : 'disconnected');
    if (!connected) {
      stompClient = null;
      messagesDiv.innerHTML = ''; // 메시지 초기화
    }
  }

  function connect() {
    const riderId = document.getElementById('riderIdInput').value.trim();

    if (!riderId) {
      alert('Please enter a riderId.');
      return;
    }

    // riderId를 쿼리 파라미터로 전달
    const url = `/ws/alarm?riderId=${encodeURIComponent(riderId)}`;
    const socket = new SockJS(url);
    stompClient = Stomp.over(socket);

    stompClient.connect({}, function (frame) {
      setConnected(true);
      console.log('Connected: ' + frame);

      // 서버에서 설정한 토픽 구독
      stompClient.subscribe('/topic/alarm/' + riderId, function (message) {
        showMessage(message.body);
      });
    }, function (error) {
      console.error('STOMP connection error: ', error);
      setConnected(false);
      alert('Connection failed: ' + error);
    });

    stompClient.ws.onclose = function () {
      console.log('STOMP connection closed');
      setConnected(false);
    };
  }

  function disconnect() {
    if (stompClient !== null) {
      stompClient.disconnect(function () {
        console.log("Disconnected");
        setConnected(false);
      });
    } else {
      setConnected(false);
    }
  }

  function showMessage(message) {
    var messageElement = document.createElement('div');
    messageElement.classList.add('message');
    messageElement.textContent = message;
    messagesDiv.appendChild(messageElement);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }
</script>

</body>
</html>
